<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ابدأ مشروعك | اعرف نفسك وأصولك واختار مشروعك</title>
<meta name="description" content="أسئلة قصيرة عن طباعك وأصولك ورأس مالك، وتطلع باسم مشروع مبدئي وخطوات أول أسبوع.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Inter:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bar"><div class="wrap">
  <a class="brand" href="index.html">ابدأ مشروعك</a>
  <a class="link" href="about.html">ليه نبدأ بأصولك؟ وقاموس المصطلحات</a>
</div></div>
<main class="wrap">
  <h1>مش عارف تبدأ بأي مشروع؟ ابدأ بنفسك وباللي معاك.</h1>
  <p>ثمانية أسئلة قصيرة عن طباعك واهتماماتك وأصولك ورأس مالك. في الآخر هتخرج باسم مشروع مبدئي وخطوات أول أسبوع.</p>
  <div id="app"></div>
  <p class="note">النتيجة ترشيح مبدئي مبني على إجاباتك. مش دراسة جدوى ولا نصيحة مالية. اقرأ <a href="about.html">إزاي بنوصل للترشيح</a>.</p>
</main>
<script>
const $ = s => document.querySelector(s);
function h(t, c, x) { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }

const Q = [
  { id: 'q1', w: 2, t: 'لو قدامك يومين فاضيين، إيه النشاط اللي بتندمج فيه من نفسك؟', o: [
    ['craft', 'أفحص خامات وأصنع أو أصلّح حاجة بإيدي.'],
    ['trade', 'أدوّر على بضاعة وأتفاوض وأقفل بيعة.'],
    ['ops', 'أرتب مكان شغال وأظبط خطوات التشغيل.'],
    ['digital', 'أبني أداة أو موقع يحل مشكلة للناس.']] },
  { id: 'q2', w: 2, t: 'آخر حاجة الناس اعتمدت عليك فيها كانت إيه؟', o: [
    ['craft', 'نفّذت حاجة ملموسة أو اكتشفت عيب في خامة.'],
    ['trade', 'بعت حاجة أو فاصلت في صفقة صعبة.'],
    ['ops', 'نظمت حسابات أو مخزن متلخبط.'],
    ['digital', 'عملت شيت أو سيستم رقمي سهّل الشغل.']] },
  { id: 'q3', w: 1, t: 'لما بتدخل مجال جديد، إيه أسرع طريقة تفهمه بيها؟', o: [
    ['craft', 'أنزل الورش وأمسك الخامة وأجرب عينة.'],
    ['trade', 'أسأل التجار وأشوف البضاعة بتتحرك إزاي.'],
    ['ops', 'أحسب تكلفة كل وحدة وأحلل المنافسين.'],
    ['digital', 'أبحث على الإنترنت وأجرب بنفسي.']] },
  { id: 'q4', w: 2, t: 'أي مشكلة من دول بتستمتع إنك تفككها؟', o: [
    ['craft', 'المنتج تقليدي وأقدر أطلّع نسخة أحسن.'],
    ['trade', 'محلات ناقصها صنف وأقدر أوفره بانتظام.'],
    ['ops', 'طلبات كتير محتاجة تنظيم وتسليم في ميعاده.'],
    ['digital', 'ناس بتضيّع وقتها في شغل متكرر وأقدر أخليه آلي.']] },
  { id: 'q5', w: -2, t: 'إيه الحاجة اللي لو اتفرضت عليك كل يوم هتخنقك؟', o: [
    ['trade', 'اللف والفصال المباشر مع الناس.'],
    ['craft', 'الوقوف الطويل في الورش وسط الخامات.'],
    ['ops', 'ضغط التجهيز اليومي ومواعيد التسليم.'],
    ['digital', 'القعدة الطويلة قدام الشاشة.']] },
  { id: 'q6', w: 1, t: 'إيه أهم هدف من المشروع بالنسبة لك؟', o: [
    ['craft', 'أبني اسم وعلامة تكبر مع الوقت.'],
    ['trade', 'أدوّر فلوسي بسرعة وأطلّع كاش أسبوعي.'],
    ['ops', 'أعمل وحدة شغل عليها طلب يومي ثابت.'],
    ['digital', 'دخل بمصاريف ثابتة قليلة جدًا.']] }
];
const LIKES = [['food', 'أكل وقهوة وضيافة'], ['fashion', 'جلود وموضة وإكسسوارات'], ['home', 'بيت ومفروشات وديكور'], ['tech', 'تكنولوجيا وأدوات رقمية'], ['kids', 'أطفال وتعليم'], ['health', 'صحة وأكل صحي']];
const HAVE = [['space', 'مكان فاضي (غرفة / ورشة / مخزن / سطح)'], ['vehicle', 'عربية أو تروسيكل أو فان'], ['gear', 'معدات أو أجهزة (ماكينة، لابتوب، كاميرا…)'], ['skill', 'مهارة أقدر أبيعها (تصميم، طبخ، خياطة، برمجة…)'], ['crowd', 'جمهور أو علاقات في السوق'], ['none', 'مفيش حاجة من دول دلوقتي']];
const CAP = [['8000', 'أقل من 10 آلاف جنيه'], ['25000', 'من 10 إلى 40 ألف جنيه'], ['70000', 'من 40 إلى 100 ألف جنيه'], ['150000', 'أكتر من 100 ألف جنيه']];
const STEPS = Q.concat([
  { id: 'likes', m: 1, t: 'إيه المجالات اللي بتشدك؟ اختار كل اللي يناسبك.', o: LIKES },
  { id: 'have', m: 1, t: 'إيه الأصول اللي تحت إيدك دلوقتي؟', o: HAVE },
  { id: 'cap', t: 'تقدر تصرف كام فعلًا على البداية؟ (تقدير تقريبي)', o: CAP }]);

/* كتالوج المشاريع: الحد الأدنى (min) بالجنيه تقدير مبدئي ويحتاج مراجعتك */
const P = [
  { t: 'علامة جلدية صغيرة لموديل واحد متقن', a: 'craft', like: ['fashion'], need: ['space', 'gear', 'skill'], min: 8000, names: ['خيط', 'أصيل', 'مقاس'] },
  { t: 'ملايات ومفروشات متخصصة بتصنيع عند ورشة قائمة', a: 'craft', like: ['home'], need: [], min: 15000, names: ['سَكَن', 'قطنة', 'نَوم'] },
  { t: 'صناديق أنشطة وتعليم للأطفال', a: 'craft', like: ['kids'], need: ['skill', 'crowd'], min: 6000, names: ['صندوق العجايب', 'ركن', 'فكرة ولعبة'] },
  { t: 'مطبخ منزلي لأصناف محددة بتوصيل واشتراكات', a: 'ops', like: ['food'], need: ['space', 'gear'], min: 10000, names: ['مطبخ الحارة', 'طبق ثابت', 'لقمة'] },
  { t: 'سناكس صحية بتصنيع عند مطبخ قائم', a: 'ops', like: ['health', 'food'], need: [], min: 12000, names: ['خفيف', 'نص طبق', 'بسيطة'] },
  { t: 'توصيل وتوريد للمحلات الصغيرة بمواعيد ثابتة', a: 'ops', like: [], need: ['vehicle'], min: 5000, names: ['وصّل', 'على طول', 'مشوار'] },
  { t: 'مورّد صغير لصنف واحد للمقاهي والمطاعم', a: 'trade', like: ['food'], need: ['vehicle', 'crowd'], min: 15000, names: ['توريدة', 'على الميعاد', 'خامة'] },
  { t: 'أدوات وشيتات جاهزة للمحلات الصغيرة', a: 'digital', like: ['tech'], need: ['skill', 'gear'], min: 2000, names: ['حسبة', 'دفتر', 'شيتي'] },
  { t: 'ردود آلية وتنظيم طلبات واتساب للمحلات', a: 'digital', like: ['tech'], need: ['skill', 'gear'], min: 3000, names: ['رد', 'ماشي', 'شغّلها'] }
];
const AR = { craft: 'الصنع وضبط الجودة بإيدك', trade: 'التوريد والتفاوض', ops: 'التشغيل والتنظيم', digital: 'بناء الأدوات الرقمية' };
const NEED_AR = Object.fromEntries(HAVE);
const LIKE_AR = Object.fromEntries(LIKES);
const SPLIT = {
  craft: [['خامات وعينات', 35], ['تصنيع دفعة صغيرة', 35], ['تصوير وتغليف وإعلان تجريبي', 30]],
  trade: [['بضاعة بكمية صغيرة', 50], ['نقل وتغليف', 15], ['تسويق واختبار', 15], ['احتياطي', 20]],
  ops: [['تجهيز وأدوات', 35], ['خامات أول أسبوعين', 30], ['تغليف وتوصيل', 20], ['احتياطي', 15]],
  digital: [['أدوات واشتراكات', 20], ['تسويق تجريبي', 40], ['مساعدة أو تصميم', 20], ['احتياطي', 20]]
};
const WEEK1 = {
  craft: ['اعمل عينة واحدة من موديل واحد وصوّرها.', 'اعرضها على 10 ناس من الفئة المستهدفة واسألهم هيدفعوا كام.', 'خد 5 طلبات مسبقة قبل ما تصنّع أول دفعة.'],
  trade: ['اختار صنف واحد ومورّدين اتنين واطلب عينة.', 'احسب التكلفة الكلية للوحدة بعد النقل والفاقد.', 'اعرض طلبية تجريبية صغيرة على 10 محلات.'],
  ops: ['حدد صنفين أو تلاتة بس واحسب تكلفة كل وحدة.', 'جرّب الإنتاج لـ10 طلبات من معارفك.', 'قِس الوقت والفاقد وسعّر على أساسهم.'],
  digital: ['اختار مشكلة واحدة لفئة واحدة وجرّب تحلها يدويًا الأول.', 'اعرض الحل على 5 ناس واسألهم مستعدين يدفعوا كام.', 'ابني النسخة البسيطة بعد أول عميل يدفع.']
};

let S = { i: 0 };
try { Object.assign(S, JSON.parse(localStorage.getItem('ebda2_v6') || '{}')); } catch (e) {}
if (!(S.i >= 0 && S.i <= STEPS.length)) S.i = 0;
function save() { try { localStorage.setItem('ebda2_v6', JSON.stringify(S)); } catch (e) {} }

function pick() {
  const a = { craft: 0, trade: 0, ops: 0, digital: 0 };
  Q.forEach(q => { if (S[q.id]) a[S[q.id]] += q.w; });
  const cap = +S.cap || 0, likes = S.likes || [], have = S.have || [];
  const r = P.filter(p => p.min <= cap).map(p => {
    const lk = p.like.filter(x => likes.includes(x));
    const hv = p.need.filter(x => have.includes(x));
    const as = !p.need.length ? 1 : hv.length ? 2 : -1;
    return { p, lk, hv, s: a[p.a] + 1.5 * lk.length + as };
  }).sort((x, y) => y.s - x.s);
  return { a, r };
}

function render() {
  const app = $('#app'); app.replaceChildren();
  if (S.i >= STEPS.length) return result(app);
  const st = STEPS[S.i], card = h('section', 'card');
  const pr = h('div', 'prog'), bar = h('i'); bar.style.width = (S.i / STEPS.length * 100) + '%'; pr.append(bar);
  const title = h('h2', 0, st.t); title.tabIndex = -1;
  card.append(pr, h('p', 'muted', 'سؤال ' + (S.i + 1) + ' من ' + STEPS.length), title);
  const box = h('div', 'opts'), row = h('div', 'row');
  const next = h('button', 'btn', 'التالي'); next.type = 'button';
  const cur = () => S[st.id] || (st.m ? [] : null);
  st.o.forEach(([v, txt]) => {
    const b = h('button', 'opt', txt); b.type = 'button';
    const on = () => st.m ? cur().includes(v) : cur() === v;
    b.setAttribute('aria-pressed', on());
    b.onclick = () => {
      if (!st.m) { S[st.id] = v; S.i++; save(); render(); return; }
      let c = cur().slice();
      if (c.includes(v)) c = c.filter(x => x !== v);
      else c = (v === 'none') ? ['none'] : c.filter(x => x !== 'none').concat(v);
      S[st.id] = c; save();
      box.querySelectorAll('.opt').forEach((o, k) => o.setAttribute('aria-pressed', c.includes(st.o[k][0])));
      next.disabled = !c.length;
    };
    box.append(b);
  });
  const back = h('button', 'btn ghost', 'رجوع'); back.type = 'button';
  back.onclick = () => { S.i = Math.max(0, S.i - 1); save(); render(); };
  row.append(S.i ? back : h('span'));
  if (st.m) { next.disabled = !cur().length; next.onclick = () => { S.i++; save(); render(); }; row.append(next); }
  card.append(box, row); app.append(card);
  title.focus({ preventScroll: true });
}

function result(app) {
  const { a, r } = pick(), top = r[0], p = top.p;
  const best = Object.keys(a).sort((x, y) => a[y] - a[x])[0];
  const c = h('section', 'card');
  c.append(h('p', 'muted', 'اسم مشروعك المقترح للبداية'), h('div', 'name', p.names[0]), h('p', 0, p.t));
  const alt = h('div', 'chips'); alt.append(h('span', 'muted', 'أسماء بديلة:'));
  p.names.slice(1).forEach(n => alt.append(h('span', 'chip', n)));
  c.append(alt, h('p', 'muted', 'الأسماء اقتراحات. اتأكد إن الاسم متاح وغير مستخدم قبل ما تعتمده.'));

  c.append(h('h2', 0, 'ليه رشحنا لك ده؟'));
  const why = h('ul', 'list');
  why.append(h('li', 0, 'أقوى ميل ظهر في إجاباتك: ' + AR[best] + '.'));
  if (top.lk.length) why.append(h('li', 0, 'اهتمامك بـ ' + top.lk.map(x => LIKE_AR[x]).join(' و') + ' بيتقاطع مع المجال ده.'));
  if (top.hv.length) why.append(h('li', 0, 'بتستغل اللي معاك: ' + top.hv.map(x => NEED_AR[x]).join(' و') + '.'));
  else if (p.need.length) why.append(h('li', 0, 'ده أحسن توافق مع ميولك، لكن مفيش عندك أصل من اللي بيحتاجه. ابدأ بالاستعارة أو التأجير المؤقت بدل الشراء.'));
  why.append(h('li', 0, 'الحد الأدنى التقديري للبداية ' + p.min.toLocaleString('ar-EG') + ' جنيه، وده مناسب لرأس المال اللي اخترته.'));
  c.append(why);

  c.append(h('h2', 0, 'توزيع مقترح لرأس مالك (نسب)'));
  const sp = h('ul', 'list'); SPLIT[p.a].forEach(([l, n]) => sp.append(h('li', 0, l + ': ' + n + '%'))); c.append(sp);

  c.append(h('h2', 0, 'خطوات أول أسبوع'));
  const wk = h('ol', 'list'); WEEK1[p.a].forEach(x => wk.append(h('li', 0, x))); c.append(wk);

  if (r.length > 1) {
    c.append(h('h2', 0, 'مشاريع قريبة تستحق تفكر فيها'));
    const al = h('ul', 'list'); r.slice(1, 3).forEach(x => al.append(h('li', 0, x.p.t))); c.append(al);
  }
  const row = h('div', 'row');
  const edit = h('button', 'btn ghost', 'عدّل إجاباتك'); edit.type = 'button';
  edit.onclick = () => { S.i = 0; save(); render(); };
  const reset = h('button', 'btn', 'ابدأ من الأول'); reset.type = 'button';
  reset.onclick = () => { S = { i: 0 }; save(); render(); };
  row.append(edit, reset); c.append(row); app.append(c);
  c.querySelector('.name').scrollIntoView({ block: 'center' });
}
render();
</script>
</body>
</html>
