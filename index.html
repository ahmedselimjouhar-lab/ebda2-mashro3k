<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اعرف أكتر عن نفسك | ابدأ مشروعك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root {
  --ink: #111111;
  --paper: #FFFFFF;
  --soft: #F5F5F5;
  --elem: #FAFAFA;
  --line: #E5E5E5;
  --mute: #777777;
  --radius-lg: 14px;
  --radius-md: 10px;
  --radius-sm: 6px;
  --transition: 160ms ease;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
body { background: var(--paper); color: var(--ink); font-size: 0.96rem; line-height: 1.75; padding: 0 16px 64px; }
.en-term { font-family: 'Inter', sans-serif; direction: ltr; unicode-bidi: isolate; display: inline-block; background: var(--soft); border: 1px solid var(--line); padding: 1px 8px; border-radius: var(--radius-sm); font-size: 0.82rem; font-weight: 500; user-select: text !important; -webkit-user-select: text !important; }
.copy-btn { font-size: 0.74rem; background: var(--paper); color: var(--mute); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 1px 7px; margin-inline-start: 4px; cursor: pointer; }
.copy-btn:hover { border-color: var(--ink); color: var(--ink); }

.bar { position: sticky; top: 0; z-index: 1000; background: rgba(255,255,255,0.96); border-bottom: 1px solid var(--line); margin: 0 -16px 24px; padding: 12px 16px; }
.wrap { max-width: 740px; margin: 0 auto; }
.bar .wrap { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 1.05rem; color: var(--ink); text-decoration: none; cursor: pointer; }
.nav-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ticker { font-size: 0.76rem; color: var(--mute); background: var(--elem); border: 1px solid var(--line); padding: 4px 10px; border-radius: 99px; }
.ticker strong { color: var(--ink); font-family: 'Inter', sans-serif; }
.select-sm { width: auto; padding: 5px 10px; border-radius: var(--radius-md); border: 1px solid var(--line); background: var(--paper); color: var(--ink); font-size: 0.8rem; cursor: pointer; }

.btn { font: inherit; font-size: 0.9rem; font-weight: 600; background: var(--ink); color: var(--paper); border: 1px solid var(--ink); border-radius: var(--radius-md); padding: 11px 20px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: var(--transition); }
.btn:hover { opacity: 0.88; }
.btn.ghost { background: var(--paper); color: var(--ink); border-color: var(--line); font-weight: 500; }
.btn.ghost:hover { border-color: var(--ink); background: var(--soft); }
.btn.sm { padding: 6px 12px; font-size: 0.8rem; }

.hero { text-align: center; margin-bottom: 22px; }
h1 { font-size: clamp(1.4rem, 4vw, 1.85rem); line-height: 1.4; font-weight: 700; }
h2 { font-size: 1.15rem; line-height: 1.5; margin-bottom: 10px; }
h3 { font-size: 1rem; line-height: 1.5; margin-bottom: 8px; }
.muted { color: var(--mute); font-size: 0.86rem; }

.card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: clamp(18px, 4vw, 28px); margin-bottom: 20px; }
.prog-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 0.82rem; font-weight: 600; color: var(--mute); }
.prog { height: 4px; background: var(--soft); border-radius: 4px; margin-bottom: 20px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--ink); transition: width 180ms ease; }

.q-block { margin-bottom: 20px; padding: 6px; border-radius: var(--radius-md); }
.q-block.missing { background: var(--soft); border: 1.5px dashed var(--ink); padding: 12px; }
.q-title { display: block; font-weight: 600; font-size: 0.94rem; margin-bottom: 8px; }
.opts { display: grid; gap: 8px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; }

.opt { text-align: right; font: inherit; font-size: 0.88rem; background: var(--elem); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 11px 14px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px; transition: var(--transition); }
.opt:hover { border-color: var(--ink); background: var(--soft); }
.opt[aria-pressed="true"] { border: 1.5px solid var(--ink); background: var(--paper); font-weight: 600; }
.opt-check { width: 17px; height: 17px; border: 1px solid var(--mute); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 0.68rem; flex-shrink: 0; }
.opt[aria-pressed="true"] .opt-check { background: var(--ink); color: var(--paper); border-color: var(--ink); }

input[type="text"], input[type="number"], input[type="email"], select { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--paper); color: var(--ink); font: inherit; font-size: 0.88rem; }
input:focus, select:focus { outline: none; border-color: var(--ink); background: var(--elem); }

.box { background: var(--soft); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 15px 18px; margin-bottom: 14px; }
.box.strong { background: var(--paper); border: 1.5px solid var(--ink); }
.tag { display: inline-block; font-size: 0.74rem; font-weight: 600; padding: 2px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--soft); }
.tag.solid { background: var(--ink); color: var(--paper); border-color: var(--ink); }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius-md); margin: 10px 0; }
table.mono-tbl { width: 100%; border-collapse: collapse; font-size: 0.83rem; text-align: right; }
table.mono-tbl th, table.mono-tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line); }
table.mono-tbl th { background: var(--soft); font-weight: 600; }

#asset-map-wrap { display: none; margin-top: 10px; border: 1px solid var(--line); border-radius: var(--radius-md); overflow: hidden; }
#leaflet-map { width: 100%; height: 220px; filter: grayscale(100%) contrast(1.05); }

.row-between { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
.task-item { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border: 1px solid var(--line); border-radius: var(--radius-md); margin-bottom: 8px; cursor: pointer; background: var(--paper); }
.task-item.done { background: var(--soft); color: var(--mute); text-decoration: line-through; }
.hidden { display: none !important; }
@media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="bar">
  <div class="wrap">
    <a class="brand" onclick="goPage(1)">اعرف أكتر عن نفسك</a>
    <div class="nav-group">
      <span class="ticker">الدولار: <strong id="fx-usd">56.15 EGP</strong></span>
      <select id="curr-select" class="select-sm" onchange="changeCurrency()">
        <option value="EGP">ج.م (EGP)</option>
        <option value="USD">دولار (USD)</option>
        <option value="SAR">ريال (SAR)</option>
        <option value="AED">درهم (AED)</option>
      </select>
      <a class="btn ghost sm" href="about.html">اعرف أكثر عن ريادة الأعمال</a>
      <button type="button" class="btn ghost sm hidden" id="nav-ws-btn" onclick="goPage(7)">مساحة مشروعي</button>
    </div>
  </div>
</div>

<main class="wrap">
  <header class="hero">
    <h1>اكتشف نفسك، واكتشف إمكانيات لم تكن تعرف أنها لديك.</h1>
  </header>

  <div id="partner-banner" class="box strong hidden"></div>

  <!-- صفحات الأسئلة (1 إلى 4) -->
  <section class="card" id="quiz-page-card">
    <div class="prog-head">
      <span id="page-title-lbl">المجموعة 1 من 5</span>
      <span id="page-step-lbl">خطوة 1 / 5</span>
    </div>
    <div class="prog"><i id="page-prog-bar" style="width:20%"></i></div>
    <div id="questions-mount"></div>
    <div class="row-between">
      <button type="button" class="btn ghost" id="prev-page-btn" onclick="prevPage()">→ السابق</button>
      <button type="button" class="btn" id="next-page-btn" onclick="nextPage()">التالي ←</button>
    </div>
  </section>

  <!-- الصفحة 5: الخلفية والأصول ورأس المال -->
  <section class="card hidden" id="page-5-card">
    <div class="prog-head">
      <span>المجموعة 5 من 5: بياناتك وأصولك</span>
      <span>خطوة 5 / 5</span>
    </div>
    <div class="prog"><i style="width:100%"></i></div>

    <div class="grid-2" style="margin-bottom:12px;">
      <div>
        <label class="q-title" for="in-name">الاسم</label>
        <input type="text" id="in-name" placeholder="اسمك">
      </div>
      <div>
        <label class="q-title" for="in-age">العمر</label>
        <select id="in-age">
          <option value="18-24">18 - 24</option>
          <option value="25-34" selected>25 - 34</option>
          <option value="35-45">35 - 45</option>
          <option value="46+">+45</option>
        </select>
      </div>
    </div>

    <div class="grid-3" style="margin-bottom:12px;">
      <div>
        <label class="q-title" for="in-edu">التعليم</label>
        <select id="in-edu">
          <option value="literate">يقرأ ويكتب</option>
          <option value="basic">ابتدائي / إعدادي</option>
          <option value="secondary_vocational">ثانوي / دبلوم فني</option>
          <option value="university" selected>جامعي</option>
        </select>
      </div>
      <div>
        <label class="q-title" for="in-field">التخصص / الخبرة</label>
        <select id="in-field">
          <option value="general" selected>عام / تجاري / إداري</option>
          <option value="science_chem">علوم / كيمياء / صيدلة</option>
          <option value="agri_vet">زراعة / بيطري / أغذية</option>
          <option value="arts_design">فنون / تصميم / عمارة</option>
          <option value="eng_tech">هندسة / حاسبات / فني</option>
        </select>
      </div>
      <div>
        <label class="q-title" for="in-gender">الجنس (اختياري)</label>
        <select id="in-gender">
          <option value="unspecified">غير محدد</option>
          <option value="male">ذكر</option>
          <option value="female">أنثى</option>
        </select>
      </div>
    </div>

    <div class="grid-2" style="margin-bottom:12px;">
      <div>
        <label class="q-title" for="in-res-gov">محافظة السكن</label>
        <select id="in-res-gov">
          <option value="الإسكندرية" selected>الإسكندرية</option>
          <option value="القاهرة الكبرى">القاهرة الكبرى</option>
          <option value="أسوان والأقصر ومدن السياحة">أسوان / الأقصر / مدن السياحة</option>
          <option value="محافظات الدلتا">الدلتا</option>
          <option value="مدن القناة">مدن القناة</option>
          <option value="محافظات الصعيد والوادي">الصعيد والوادي</option>
        </select>
      </div>
      <div>
        <label class="q-title" for="in-env-type">طبيعة منطقتك</label>
        <select id="in-env-type">
          <option value="metro_city" selected>مدينة كبرى</option>
          <option value="touristic_city">مدينة سياحية</option>
          <option value="rural_village">قرية / ريف زراعي</option>
          <option value="border_port_city">مدينة تجارية / ميناء</option>
        </select>
      </div>
    </div>

    <div class="grid-2" style="margin-bottom:16px;">
      <div>
        <label class="q-title" for="in-local-raw">أقرب مورد متاح بمحيطك</label>
        <select id="in-local-raw">
          <option value="workshops_markets" selected>أسواق جملة وورش ومصانع</option>
          <option value="palm_dates_waste">نخيل وتمور وجريد نخيل</option>
          <option value="crops_herbs_farms">مزارع خضار وأعشاب ومحاصيل</option>
          <option value="african_coffee_spices">بن أفريقي وعطارة وتوابل</option>
          <option value="no_special_raw">منطقة سكنية / خدمية</option>
        </select>
      </div>
      <div>
        <label class="q-title" for="in-first-adopter">أقرب عميل أول تبيعه</label>
        <select id="in-first-adopter">
          <option value="online_consumers" selected>عملاء أونلاين</option>
          <option value="local_shops_cafes">محلات وكافيهات وعيادات</option>
          <option value="tourists_visitors">سياح وبازارات وفنادق</option>
          <option value="village_farmers">مزارعون وأهالي منطقتي</option>
        </select>
      </div>
    </div>

    <label class="q-title">الأصل المتاح لديك الآن</label>
    <div class="grid-3" id="asset-cards-box" style="margin-bottom:14px;">
      <button type="button" class="opt" data-asset="home_room" aria-pressed="true" onclick="toggleAsset(this, 'home_room')"><span>غرفة بالمنزل</span><span class="opt-check">✓</span></button>
      <button type="button" class="opt" data-asset="vacant_apt" aria-pressed="false" onclick="toggleAsset(this, 'vacant_apt')"><span>شقة فاضية</span><span class="opt-check">✓</span></button>
      <button type="button" class="opt" data-asset="roof" aria-pressed="false" onclick="toggleAsset(this, 'roof')"><span>سطح منزل</span><span class="opt-check">✓</span></button>
      <button type="button" class="opt" data-asset="land" aria-pressed="false" onclick="toggleAsset(this, 'land')"><span>أرض زراعية/فضاء</span><span class="opt-check">✓</span></button>
      <button type="button" class="opt" data-asset="warehouse" aria-pressed="false" onclick="toggleAsset(this, 'warehouse')"><span>مخزن مستقل</span><span class="opt-check">✓</span></button>
      <button type="button" class="opt" data-asset="workshop" aria-pressed="false" onclick="toggleAsset(this, 'workshop')"><span>ورشة إنتاج</span><span class="opt-check">✓</span></button>
      <button type="button" class="opt" data-asset="shop_office" aria-pressed="false" onclick="toggleAsset(this, 'shop_office')"><span>محل / مكتب</span><span class="opt-check">✓</span></button>
      <button type="button" class="opt" data-asset="vehicle" aria-pressed="false" onclick="toggleAsset(this, 'vehicle')"><span>سيارة / فان / تروسيكل</span><span class="opt-check">✓</span></button>
      <button type="button" class="opt" data-asset="none" aria-pressed="false" onclick="toggleAsset(this, 'none')"><span>موبايل/لابتوب فقط</span><span class="opt-check">✓</span></button>
    </div>

    <div id="asset-details-panel" class="box" style="margin-bottom:16px;">
      <div class="grid-3" style="margin-bottom:10px;">
        <div>
          <label class="q-title" for="in-asset-own">الحيازة</label>
          <select id="in-asset-own">
            <option value="owned_self">مِلكي</option>
            <option value="owned_family" selected>مِلك للأهل</option>
            <option value="rented">إيجار</option>
          </select>
        </div>
        <div>
          <label class="q-title" for="in-asset-gov">موقع الأصل</label>
          <select id="in-asset-gov">
            <option value="نفس محافظة ومكان إقامتي" selected>نفس محافظة سكني</option>
            <option value="القاهرة الكبرى">القاهرة الكبرى</option>
            <option value="الإسكندرية">الإسكندرية</option>
            <option value="أسوان / الأقصر">أسوان / الأقصر</option>
            <option value="محافظات الدلتا">الدلتا</option>
            <option value="محافظات الصعيد">الصعيد</option>
          </select>
        </div>
        <div>
          <label class="q-title" for="in-asset-area">المساحة (م²)</label>
          <input type="number" id="in-asset-area" value="16" min="2">
        </div>
      </div>
      <div class="grid-2">
        <div>
          <label class="q-title" for="in-asset-util">طبيعة المرافق</label>
          <select id="in-asset-util">
            <option value="residential_quiet" selected>سكني هادئ</option>
            <option value="sunny_ventilated">مشمس وجيد التهوية والصرف</option>
            <option value="commercial_licensed">تجاري / قابل للترخيص</option>
          </select>
        </div>
        <div>
          <label class="q-title">موقع الأصل على الخريطة (اختياري)</label>
          <div style="display:flex; gap:6px; flex-wrap:wrap;">
            <button type="button" class="btn ghost sm" onclick="locateByGPS()">GPS</button>
            <button type="button" class="btn ghost sm" onclick="toggleMapPin()">الخريطة</button>
          </div>
          <div id="gps-status" class="muted" style="font-size:0.74rem; margin-top:4px;"></div>
        </div>
      </div>
      <div id="asset-map-wrap"><div id="leaflet-map"></div></div>
    </div>

    <div class="grid-2" style="margin-bottom:6px;">
      <div>
        <label class="q-title" for="in-capital">رأس المال المتاح للبدء</label>
        <input type="number" id="in-capital" value="20000" min="500" step="500" oninput="updateCapPreview()">
      </div>
      <div>
        <label class="q-title" for="in-cap-curr">العملة</label>
        <select id="in-cap-curr" onchange="updateCapPreview()">
          <option value="EGP">جنيه مصري (EGP)</option>
          <option value="USD">دولار (USD)</option>
          <option value="SAR">ريال (SAR)</option>
          <option value="AED">درهم (AED)</option>
        </select>
      </div>
    </div>
    <p id="cap-preview-note" class="muted" style="font-size:0.78rem;"></p>

    <div class="row-between">
      <button type="button" class="btn ghost" onclick="goPage(4)">→ السابق</button>
      <button type="button" class="btn" onclick="showResultCapsule()">اعرض خطة المشروع ←</button>
    </div>
  </section>

  <!-- الصفحة 6: كبسولة البداية -->
  <section class="card hidden" id="page-6-card">
    <div id="capsule-mount"></div>
  </section>

  <!-- الصفحة 7: مساحة مشروعي -->
  <section class="card hidden" id="page-7-card">
    <div id="workspace-mount"></div>
  </section>
</main>

<script>
let FX = { EGP: 1, USD: 56.15, SAR: 14.97, AED: 15.29 };
const SYM = { EGP: 'ج.م', USD: '$', SAR: 'ر.س', AED: 'د.إ' };
let dispCurr = 'EGP';
let curPage = 1;
let partnerParams = null;

const state = {
  ans: {},
  assets: ['home_room'],
  assetMeta: { own: 'owned_family', gov: 'نفس محافظة ومكان إقامتي', area: 16, util: 'residential_quiet', coords: null },
  user: {
    name: '', age: '25-34', edu: 'university', field: 'general', gender: 'unspecified',
    resGov: 'الإسكندرية', envType: 'metro_city', localRaw: 'workshops_markets',
    firstAdopter: 'online_consumers', capEGP: 20000, email: '', token: ''
  },
  rec: null,
  ws: { quotes: [], tasks: {}, calc: { c1: 100, c2: 45, c3: 15, c4: 30, c5: 30, price: 310 } }
};

function esc(s) {
  return String(s || '').replace(/&/g, '&').replace(/</g, '<').replace(/>/g, '>').replace(/"/g, '"').replace(/'/g, ''');
}

function termHtml(arLabel, enTerm) {
  const safeEn = esc(enTerm);
  return `${arLabel ? arLabel + ' ' : ''}<span class="en-term">${safeEn}</span><button type="button" class="copy-btn" data-en="${safeEn}" onclick="copyEnTerm(this)">نسخ</button>`;
}

function copyEnTerm(btn) {
  const txt = btn.getAttribute('data-en') || '';
  if (navigator.clipboard && txt) {
    navigator.clipboard.writeText(txt).then(() => {
      const old = btn.textContent;
      btn.textContent = 'تم ✓';
      setTimeout(() => { btn.textContent = old; }, 1200);
    });
  }
}

async function syncLiveFX() {
  try {
    const r = await fetch('https://open.er-api.com/v6/latest/USD');
    if (r.ok) {
      const d = await r.json();
      if (d && d.rates && d.rates.EGP) {
        FX.USD = d.rates.EGP;
        FX.SAR = FX.USD / (d.rates.SAR || 3.75);
        FX.AED = FX.USD / (d.rates.AED || 3.6725);
        const el = document.getElementById('fx-usd');
        if (el) el.textContent = FX.USD.toFixed(2) + ' EGP';
      }
    }
  } catch (e) {}
  updateCapPreview();
}

function getCapInEGP() {
  const el = document.getElementById('in-capital');
  const cEl = document.getElementById('in-cap-curr');
  const val = el ? parseFloat(el.value) : 20000;
  if (isNaN(val) || val <= 0) return 20000;
  const c = cEl ? cEl.value : 'EGP';
  return Math.round(val * (FX[c] || 1));
}

function fmtMoney(egpAmount) {
  const rate = FX[dispCurr] || 1;
  const v = egpAmount / rate;
  const s = SYM[dispCurr] || 'ج.م';
  if (dispCurr === 'EGP') return Math.round(v).toLocaleString('ar-EG') + ' ' + s;
  return v.toLocaleString('en-US', { maximumFractionDigits: 1 }) + ' ' + s;
}

function updateCapPreview() {

function renderQuizPage() {
  const group = QUESTION_PAGES[curPage - 1];
  if (!group) return;
  document.getElementById('page-title-lbl').textContent = group.title;
  document.getElementById('page-step-lbl').textContent = `خطوة ${curPage} / 5`;
  document.getElementById('page-prog-bar').style.width = (curPage * 20) + '%';
  document.getElementById('prev-page-btn').style.visibility = curPage === 1 ? 'hidden' : 'visible';

  const mount = document.getElementById('questions-mount');
  mount.innerHTML = group.items.map(item => {
    const sel = state.ans[item.id] || '';
    const optsHtml = item.opts.map(o => {
      const pressed = sel === o.v ? 'true' : 'false';
      return `
        <button type="button" class="opt" aria-pressed="${pressed}" onclick="selectOpt('${item.id}', '${o.v}', this)">
          <span>${esc(o.t)}</span>
          <span class="opt-check">✓</span>
        </button>
      `;
    }).join('');
    return `
      <div class="q-block" id="qb-${item.id}">
        <span class="q-title">${esc(item.q)}</span>
        <div class="opts">${optsHtml}</div>
      </div>
    `;
  }).join('');
}

function selectOpt(qId, val, btnEl) {
  state.ans[qId] = val;
  const block = document.getElementById('qb-' + qId);
  if (block) {
    block.classList.remove('missing');
    block.querySelectorAll('.opt').forEach(b => b.setAttribute('aria-pressed', 'false'));
  }
  btnEl.setAttribute('aria-pressed', 'true');
  saveLocal();
}

function nextPage() {
  const group = QUESTION_PAGES[curPage - 1];
  if (group) {
    for (const item of group.items) {
      if (!state.ans[item.id]) {
        const b = document.getElementById('qb-' + item.id);
        if (b) {
          b.classList.add('missing');
          b.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        return;
      }
    }
  }
  if (curPage === 4 && partnerParams) {
    showPartnerReport();
    return;
  }
  goPage(curPage + 1);
}

function prevPage() {
  if (curPage > 1) goPage(curPage - 1);
}

function goPage(p) {
  curPage = p;
  document.getElementById('quiz-page-card').classList.toggle('hidden', p < 1 || p > 4);
  document.getElementById('page-5-card').classList.toggle('hidden', p !== 5);
  document.getElementById('page-6-card').classList.toggle('hidden', p !== 6);
  document.getElementById('page-7-card').classList.toggle('hidden', p !== 7);

  if (p >= 1 && p <= 4) renderQuizPage();
  if (p === 6) {
    if (!state.rec) state.rec = computeBestProject();
    renderCapsulePage();
  }
  if (p === 7) {
    if (!state.rec) state.rec = computeBestProject();
    renderWorkspacePage();
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

let mapObj = null;
let mapPin = null;

function toggleAsset(btnEl, key) {
  const box = document.getElementById('asset-cards-box');
  if (key === 'none') {
    state.assets = ['none'];
    box.querySelectorAll('.opt').forEach(b => b.setAttribute('aria-pressed', 'false'));
    btnEl.setAttribute('aria-pressed', 'true');
  } else {
    state.assets = state.assets.filter(a => a !== 'none');
    const noneBtn = box.querySelector('[data-asset="none"]');
    if (noneBtn) noneBtn.setAttribute('aria-pressed', 'false');

    if (state.assets.includes(key)) {
      state.assets = state.assets.filter(a => a !== key);
      btnEl.setAttribute('aria-pressed', 'false');
    } else {
      state.assets.push(key);
      btnEl.setAttribute('aria-pressed', 'true');
    }
    if (!state.assets.length) {
      state.assets = ['none'];
      if (noneBtn) noneBtn.setAttribute('aria-pressed', 'true');
    }
  }
  const panel = document.getElementById('asset-details-panel');
  if (panel) panel.style.display = state.assets.includes('none') ? 'none' : 'block';
  saveLocal();
}

function locateByGPS() {
  const st = document.getElementById('gps-status');
  if (!navigator.geolocation) { st.textContent = 'GPS غير مدعوم.'; return; }
  st.textContent = 'جاري التحديد...';
  navigator.geolocation.getCurrentPosition(
    pos => {
      const lat = Math.round(pos.coords.latitude * 100) / 100;
      const lng = Math.round(pos.coords.longitude * 100) / 100;
      state.assetMeta.coords = { lat, lng };
      st.textContent = `تم الربط (${lat}, ${lng})`;
      if (mapObj) {
        mapObj.setView([lat, lng], 12);
        if (mapPin) mapPin.setLatLng([lat, lng]);
        else mapPin = L.marker([lat, lng]).addTo(mapObj);
      }
    },
    () => { st.textContent = 'تعذر الوصول لـ GPS.'; }
  );
}

function toggleMapPin() {
  const wrap = document.getElementById('asset-map-wrap');
  const show = wrap.style.display !== 'block';
  wrap.style.display = show ? 'block' : 'none';
  if (show && window.L) {
    setTimeout(() => {
      if (!mapObj) {
        mapObj = L.map('leaflet-map').setView([31.2001, 29.9187], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(mapObj);
        mapObj.on('click', e => {
          const lat = Math.round(e.latlng.lat * 100) / 100;
          const lng = Math.round(e.latlng.lng * 100) / 100;
          state.assetMeta.coords = { lat, lng };
          if (mapPin) mapPin.setLatLng(e.latlng);
          else mapPin = L.marker(e.latlng).addTo(mapObj);
          document.getElementById('gps-status').textContent = `تم التحديد (${lat}, ${lng})`;
        });
      } else { mapObj.invalidateSize(); }
    }, 150);
  }
}

function computeBestProject() {
  const a = state.ans;
  const u = state.user;
  const assets = state.assets;
  const am = state.assetMeta;
  const cap = u.capEGP;

  const drives = { creator: 0, arbitrageur: 0, orchestrator: 0, strategist: 0 };
  [a.q1, a.q2, a.q3].forEach(v => { if (drives[v] !== undefined) drives[v] += 2.5; });
  if (a.q12 === 'mot_creation') drives.creator += 2;
  if (a.q12 === 'mot_wealth') drives.arbitrageur += 2;
  if (a.q12 === 'mot_freedom') { drives.orchestrator += 1.5; drives.strategist += 1.5; }

  const dKeys = Object.keys(drives).sort((x, y) => drives[y] - drives[x]);
  const top1 = dKeys[0];
  const top2 = dKeys[1];
  const spread = drives[top1] - drives[dKeys[3]];

  let topologyType = 'single';
  if (spread <= 2.0) topologyType = 'balanced';
  else if (drives[top1] - drives[top2] <= 2.0) topologyType = 'hybrid';

  const mat = a.q4 || 'mat_warm';
  const mobility = a.q5 || 'loc_hybrid';
  const learn = a.q6 || 'learn_trial';
  const blocker = a.q7 || 'blk_capital';
  const hate = a.q8 || 'hate_retail';
  const pace = a.q9 || 'pace_med';

  const scored = CATALOG_30.map(p => {
    let score = 0;
    if (topologyType === 'balanced') {
      score += ((p.drives.creator + p.drives.arbitrageur + p.drives.orchestrator + p.drives.strategist) / 4) * 0.8;
    } else if (topologyType === 'hybrid') {
      score += (p.drives[top1] || 0) * 1.0 + (p.drives[top2] || 0) * 0.95;
      if ((p.drives[top1] || 0) >= 16 && (p.drives[top2] || 0) >= 16) score += 18;
    } else {
      score += (p.drives[top1] || 0) * 1.3 + (p.drives[top2] || 0) * 0.4;
    }

    if (p.mats[0] === mat) score += 32;
    else if (p.mats.includes(mat)) score += 20;

    if (p.mob[0] === mobility) score += 18;
    else if (p.mob.includes(mobility)) score += 10;
    else if (mobility === 'loc_kinetic' && !p.mob.includes('loc_kinetic')) score -= 12;

    if (p.fields[0] === u.field && u.field !== 'general') score += 24;
    else if (p.fields.includes(u.field)) score += 10;

    if (u.edu === 'literate' || u.edu === 'basic') {
      if (['p27_whatsapp_ai_b2b', 'p29_niche_marketplace_dir', 'p30_sme_costing_advisory', 'p05_bio_agri_compound'].includes(p.id)) score -= 60;
      if (['p14_kinetic_b2b_route', 'p13_smart_arbitrage_flip', 'p26_mobile_auto_detailing'].includes(p.id)) score += 14;
    }

    if (p.id === 'p02_nocode_web_creator' && mat === 'mat_digital' && (top1 === 'creator' || topologyType === 'hybrid')) {
      if (learn === 'learn_trial' || blocker === 'blk_math') score += 22;
    }
    if (p.id === 'p01_white_label_brand' && hate === 'hate_factory' && (top1 === 'creator' || top2 === 'arbitrageur')) score += 24;
    if (p.id === 'p03_service_invention' && u.localRaw === 'no_special_raw' && (top1 === 'creator' || top2 === 'orchestrator')) score += 24;

    if (learn === 'learn_study' && ['p04_liquid_cosmetics_lab', 'p05_bio_agri_compound', 'p30_sme_costing_advisory'].includes(p.id)) score += 10;
    if (learn === 'learn_people' && ['p13_smart_arbitrage_flip', 'p14_kinetic_b2b_route', 'p15_zero_stock_b2b_broker'].includes(p.id)) score += 10;

    if (p.envs.includes(u.envType)) score += 14;
    if (p.raws[0] === u.localRaw && u.localRaw !== 'workshops_markets') score += 26;
    else if (p.raws.includes(u.localRaw)) score += 12;

    if (p.adopters[0] === u.firstAdopter) score += 16;
    else if (p.adopters.includes(u.firstAdopter)) score += 8;

    if (assets.some(as => p.assets.includes(as))) score += 16;

    if ((assets.includes('roof') || assets.includes('land')) && p.id === 'p21_agri_solar_drying') {
      score += (am.util === 'sunny_ventilated' || u.envType === 'rural_village' || u.resGov.includes('أسوان') || u.resGov.includes('الصعيد')) ? 45 : 25;
    }
    if (assets.includes('home_room') && !assets.includes('roof') && !assets.includes('land') && !assets.includes('warehouse')) {
      if (p.id === 'p05_bio_agri_compound' && (u.field === 'science_chem' || u.field === 'agri_vet') && u.envType === 'rural_village') score += 36;
    }
    if ((assets.includes('warehouse') || assets.includes('shop_office')) && p.id === 'p16_aswan_dates_coffee' && (u.localRaw === 'african_coffee_spices' || u.localRaw === 'palm_dates_waste')) score += 28;
    if (assets.includes('vehicle') && ['p14_kinetic_b2b_route', 'p26_mobile_auto_detailing', 'p19_regional_fmcg_supply'].includes(p.id)) score += 22;
    if ((assets.includes('workshop') || assets.includes('warehouse')) && p.id === 'p24_packaging_boxes_unit') score += 20;

    if (p.hateBonus === hate) score += 15;
    if (hate === 'hate_field' && p.mob[0] === 'loc_kinetic') score -= 45;
    if (hate === 'hate_screen' && p.mats[0] === 'mat_digital') score -= 45;
    if (hate === 'hate_factory' && ['p22_vacuum_prepped_veggies', 'p24_packaging_boxes_unit'].includes(p.id)) score -= 25;

    if (p.pace === pace) score += 10;
    if (u.age === '46+' && p.mob[0] === 'loc_kinetic') score -= 12;

    return { proj: p, score };
  }).sort((x, y) => y.score - x.score);

  const p = scored[0].proj;
  const isPremium = cap >= 120000;
  const isLowCap = cap < 15000;
  const actualAssetGov = am.gov === 'نفس محافظة ومكان إقامتي' ? u.resGov : am.gov;

  let customTitle = `${p.title} (${termHtml('', p.en)})`;
  if (isPremium) customTitle = `نسخة Premium: ${p.title} (${termHtml('', p.en)})`;
  else if (isLowCap) customTitle = `مسار البدء بالعينات (MVP): ${p.title} (${termHtml('', p.en)})`;

  // سطر توجيهي مختصر ومباشر يربط الأصل وأسلوب التنفيذ والأمان المالي بدون شرح مطول
  const modeDirectives = {
    mode_outsource: 'التنفيذ بالقطعة لدى مصنع/ورشة خارجية مع استخدام الحاسبة المدمجة.',
    mode_partner: 'التنفيذ بالمشاركة مع شريك يكمل الجانب التشغيلي أو البيعي.',
    mode_hire: 'التنفيذ عبر الاستعانة بفني أو مندوب باليومية/العمولة.'
  };
  const isQuietHome = (assets.includes('home_room') || assets.includes('vacant_apt')) && am.util === 'residential_quiet';
  let assetDirective = assets.includes('none')
    ? `التشغيل من (${u.resGov}) بدون عقار ثابت.`
    : `استغلال الأصل في (${actualAssetGov} — ${am.area} م²) للفحص والتغليف والإدارة.`;

  if (p.legal === 'food_kitchen' && isQuietHome && p.id !== 'p21_agri_solar_drying') {
    assetDirective = `تنبيه: الأصل في (${actualAssetGov}) سكني؛ يتم التحضير في مطبخ مرخص مشترك وليس داخل الشقة.`;
  } else if (p.legal === 'agri_bio' && isQuietHome) {
    assetDirective = `تنبيه: التحضير الأولي بغرفتك في (${actualAssetGov}) يقتصر على المستخلصات النباتية الآمنة فقط.`;
  }

  const runwayDirective = a.q10 === 'runway_no'
    ? 'ابدأ هذا المسار كمشروع جانبي بجانب دخلك الأساسي وبنظام الحجز المسبق فقط.'
    : (isPremium ? 'تنبيه: اختبر استعداد شريحة A+ للدفع بعينة أولية قبل صرف الميزانية الكاملة.' : '');

  const c1 = Math.round(cap * 0.42);
  const c2 = Math.round(cap * 0.18);
  const c3 = Math.round(cap * 0.22);
  const c4 = cap - (c1 + c2 + c3);

  return {
    id: p.id,
    title: customTitle,
    modelDesc: p.modelDesc,
    execLine: `${assetDirective} | ${modeDirectives[a.q11 || 'mode_outsource']}`,
    runwayLine: runwayDirective,
    isNovel: p.isNovel,
    capSplit: [
      { item: isLowCap ? 'تنفيذ العينات الأولية (MVP) لدى مورد/مصنع خارجي' : 'تمويل الدفعة الأولى / التجهيز الأساسي', amount: c1 },
      { item: 'العبوات، الهوية، وأدوات الفحص والتسليم', amount: c2 },
      { item: 'تجربة اختبار الطلب والوصول لأول 10 عملاء', amount: c3 },
      { item: 'احتياطي سيولة نقدية لحماية التشغيل', amount: c4 }
    ],
    clusters: p.clusters,
    kwAr: p.kwAr,
    kwEn: p.kwEn,
    legal: p.legal,
    calcConfig: { title: p.calc.title, labels: p.calc.labels, defaults: { ...p.calc.def } },
    firstExperiment: p.exp,
    risk: p.risk,
    fiveSteps: [
      'حدد المواصفة القياسية للعينة الأولى.',
      'اجمع 3 عروض أسعار من الموردين وسجلها في مساحة مشروعك.',
      'نفّذ عينة الاختبار (MVP) واضبط تكلفتها في الحاسبة.',
      'اعرض العينة للبيع الفعلي واكسب أول زبون راضٍ.',
      'استخدم تقييم أول زبون راضٍ لجلب الـ 10 عملاء التاليين.'
    ]
  };
}

      ${r.runwayLine ? `<p style="font-size:0.84rem; background:var(--soft); padding:6px 10px; border-radius:var(--radius-sm); margin-bottom:6px;">${esc(r.runwayLine)}</p>` : ''}
      <p class="muted" style="font-size:0.78rem;">
        ${r.isNovel ? 'مسار ابتكاري جديد (أرقام افتراضية للاختبار الأولي).' : 'أرقام استرشادية (نوفمبر 2026 — هامش تغير ±15% إلى ±25% حسب سعر الصرف).'}
      </p>
    </div>

    <h3>1. توزيع رأس المال (${fmtMoney(cap)})</h3>
    <div class="table-wrap">
      <table class="mono-tbl">
        <thead><tr><th>البند</th><th>المبلغ</th></tr></thead>
        <tbody>${splitRows}</tbody>
      </table>
    </div>

    <div class="grid-2" style="margin:16px 0;">
      <div class="box strong" style="margin-bottom:0;">
        <h3>2. أول تجربة لاختبار الطلب</h3>
        <p style="font-size:0.88rem;">${esc(r.firstExperiment)}</p>
      </div>
      <div class="box" style="margin-bottom:0;">
        <h3>3. أهم مخاطرة يجب الانتباه لها</h3>
        <p style="font-size:0.88rem;">${esc(r.risk)}</p>
      </div>
    </div>

    <div class="box">
      <h3>4. خطوات التنفيذ الخمس</h3>
      <ol style="padding-right:20px; font-size:0.88rem;">
        ${r.fiveSteps.map(s => `<li>${esc(s)}</li>`).join('')}
      </ol>
    </div>

    <div class="box">
      <h3>5. أين تجد الموردين؟</h3>
      <ul style="padding-right:18px; font-size:0.86rem; margin-bottom:10px;">
        ${r.clusters.map(c => `<li>${esc(c)}</li>`).join('')}
      </ul>
      <div style="line-height:2;">${kwArHtml} ${kwEnHtml}</div>
    </div>

    <h3>6. الإجراءات القانونية والجهات الرسمية</h3>
    <div class="table-wrap">
      <table class="mono-tbl">
        <thead><tr><th>المرحلة</th><th>الإجراء</th><th>الجهة الرسمية</th></tr></thead>
        <tbody>${legalRows}</tbody>
      </table>
    </div>

    <div class="box strong" style="background:var(--soft); margin-top:18px;">
      <h3>افتح مساحة مشروعك الشخصية (الحاسبة + جدول الموردين)</h3>
      <div class="grid-2" style="margin:10px 0;">
        <input type="text" id="cap-name" value="${esc(state.user.name === 'صديقنا' ? '' : state.user.name)}" placeholder="اسمك">
        <input type="email" id="cap-email" value="${esc(state.user.email)}" placeholder="بريدك الإلكتروني (اختياري)" dir="ltr" style="text-align:left;">
      </div>
      <div class="row-between" style="margin-top:8px; padding-top:10px;">
        <button type="button" class="btn ghost sm" onclick="sharePartnerLink()">اختبر توافق شريك</button>
        <button type="button" class="btn" onclick="openWorkspace()">افتح مساحة مشروعي ←</button>
      </div>
    </div>
  `;
}

function genToken() {
  const a = new Uint8Array(12);
  if (window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(a);
  else for (let i = 0; i < 12; i++) a[i] = Math.floor(Math.random() * 256);
  return Array.from(a, b => b.toString(16).padStart(2, '0')).join('');
}

function openWorkspace() {
  const nEl = document.getElementById('cap-name');
  const eEl = document.getElementById('cap-email');
  if (nEl && nEl.value.trim()) state.user.name = nEl.value.trim();
  if (eEl && eEl.value.trim()) state.user.email = eEl.value.trim();
  if (!state.user.token) state.user.token = genToken();

  document.getElementById('nav-ws-btn').classList.remove('hidden');
  saveLocal();
  goPage(7);
}

function renderWorkspacePage() {
  const r = state.rec || computeBestProject();
  state.rec = r;
  const uName = state.user.name || 'صديقنا';
  const wsUrl = `${window.location.origin}${window.location.pathname}?ws_token=${state.user.token || genToken()}`;

  const quotes = state.ws.quotes;
  let minLanded = Infinity;
  quotes.forEach(q => {
    const l = q.price + (q.ship / Math.max(q.moq, 1)) + (q.price * (q.waste / 100));
    if (l < minLanded) minLanded = l;
  });

  const qRows = quotes.map((q, idx) => {
    const landed = q.price + (q.ship / Math.max(q.moq, 1)) + (q.price * (q.waste / 100));
    const best = quotes.length > 1 && Math.abs(landed - minLanded) < 0.01;
    return `
      <tr>
        <td><strong>${esc(q.name)}</strong><div class="muted" style="font-size:0.74rem;">${esc(q.area)}</div></td>
        <td>${esc(q.mat)}</td>
        <td>${fmtMoney(q.price)}</td>
        <td>${q.moq}</td>
        <td><strong>${fmtMoney(Math.round(landed))}</strong> ${best ? '<span class="tag solid">الأفضل</span>' : ''}</td>
        <td><button type="button" class="btn ghost sm" onclick="delQuote(${idx})">حذف</button></td>
      </tr>
    `;
  }).join('');

  const cfg = r.calcConfig;
  const c = state.ws.calc;
  const varCost = (c.c1 || 0) + (c.c2 || 0) + (c.c3 || 0) + (c.c4 || 0) + (c.c5 || 0);
  const margin = (c.price || 0) - varCost;
  const marginPct = c.price > 0 ? Math.round((margin / c.price) * 100) : 0;

  const mount = document.getElementById('workspace-mount');
  mount.innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:14px; padding-bottom:12px; border-bottom:1px solid var(--line);">
      <div>
        <h2>أهلًا يا ${esc(uName)}</h2>
        <p class="muted" style="font-size:0.84rem;">${r.title}</p>
      </div>
      <div style="display:flex; gap:6px;">
        <button type="button" class="btn ghost sm" onclick="copyWsLink('${wsUrl}', this)">نسخ رابط مساحتي</button>
        <button type="button" class="btn ghost sm" onclick="emailWsLink('${wsUrl}')">إرسال للبريد</button>
      </div>
    </div>

    <h3>1. ${esc(cfg.title)}</h3>
    <div class="grid-3" style="margin-bottom:10px;">
      <div><label class="muted" style="font-size:0.75rem;">${esc(cfg.labels[0])}</label><input type="number" id="uc-1" value="${c.c1}" oninput="recalcWsUnit()"></div>
      <div><label class="muted" style="font-size:0.75rem;">${esc(cfg.labels[1])}</label><input type="number" id="uc-2" value="${c.c2}" oninput="recalcWsUnit()"></div>
      <div><label class="muted" style="font-size:0.75rem;">${esc(cfg.labels[2])}</label><input type="number" id="uc-3" value="${c.c3}" oninput="recalcWsUnit()"></div>
      <div><label class="muted" style="font-size:0.75rem;">${esc(cfg.labels[3])}</label><input type="number" id="uc-4" value="${c.c4}" oninput="recalcWsUnit()"></div>
      <div><label class="muted" style="font-size:0.75rem;">${esc(cfg.labels[4])}</label><input type="number" id="uc-5" value="${c.c5}" oninput="recalcWsUnit()"></div>
      <div><label style="font-size:0.76rem; font-weight:700;">سعر البيع للوحدة</label><input type="number" id="uc-p" value="${c.price}" oninput="recalcWsUnit()"></div>
    </div>
    <div class="box strong" id="uc-summary">
      التكلفة المتغيرة: <strong>${fmtMoney(varCost)}</strong> | صافي هامش المساهمة: <strong>${fmtMoney(margin)} (${marginPct}%)</strong>
    </div>

    <h3 style="margin-top:20px;">2. مقارنة عروض أسعار الموردين</h3>
    <div class="box">
      <div class="grid-3" style="margin-bottom:8px;">
        <input type="text" id="q-in-name" placeholder="اسم المورد">
        <input type="text" id="q-in-area" placeholder="المنطقة">
        <input type="text" id="q-in-mat" placeholder="الخامة">
      </div>
      <div class="grid-3">
        <input type="number" id="q-in-price" placeholder="سعر الوحدة" min="1">
        <input type="number" id="q-in-moq" placeholder="أقل كمية MOQ" value="50" min="1">
        <input type="number" id="q-in-ship" placeholder="تكلفة النقل" value="150" min="0">
      </div>
      <div class="grid-2" style="margin-top:8px;">
        <input type="number" id="q-in-waste" placeholder="نسبة الهدر %" value="3" min="0">
        <button type="button" class="btn" onclick="addQuote()">+ إضافة العرض</button>
      </div>
    </div>
    <div class="table-wrap">
      <table class="mono-tbl">
        <thead><tr><th>المورد</th><th>الخامة</th><th>السعر</th><th>MOQ</th><th>التكلفة الكلية للوحدة</th><th>حذف</th></tr></thead>
        <tbody>${qRows || '<tr><td colspan="6" class="muted" style="text-align:center;">سجل أول عرض سعر من السوق بالأعلى.</td></tr>'}</tbody>
      </table>
    </div>

    <h3 style="margin-top:20px;">3. مهام التأسيس</h3>
    ${r.fiveSteps.map((st, idx) => {
      const done = Boolean(state.ws.tasks['t_' + idx]);
      return `
        <div class="task-item ${done ? 'done' : ''}" onclick="toggleTask(${idx})">
          <span class="opt-check" style="${done ? 'background:#111;color:#fff;border-color:#111;' : ''}">${done ? '✓' : ''}</span>
          <span>${idx + 1}. ${esc(st)}</span>
        </div>
      `;
    }).join('')}

    <div class="row-between">
      <button type="button" class="btn ghost sm" onclick="goPage(6)">→ رجوع لخطة المشروع</button>
      <div style="display:flex; gap:6px;">
        <button type="button" class="btn ghost sm" onclick="exportDataJSON()">تنزيل بياناتي</button>
        <button type="button" class="btn ghost sm" onclick="clearAllData()">حذف البيانات</button>
      </div>
    </div>
  `;
}

function recalcWsUnit() {
  const c = state.ws.calc;
  c.c1 = parseFloat(document.getElementById('uc-1').value) || 0;
  c.c2 = parseFloat(document.getElementById('uc-2').value) || 0;
  c.c3 = parseFloat(document.getElementById('uc-3').value) || 0;
  c.c4 = parseFloat(document.getElementById('uc-4').value) || 0;
  c.c5 = parseFloat(document.getElementById('uc-5').value) || 0;
  c.price = parseFloat(document.getElementById('uc-p').value) || 0;
  saveLocal();
  const varCost = c.c1 + c.c2 + c.c3 + c.c4 + c.c5;
  const margin = c.price - varCost;
  const marginPct = c.price > 0 ? Math.round((margin / c.price) * 100) : 0;
  const box = document.getElementById('uc-summary');
  if (box) box.innerHTML = `التكلفة المتغيرة: <strong>${fmtMoney(varCost)}</strong> | صافي هامش المساهمة: <strong>${fmtMoney(margin)} (${marginPct}%)</strong>`;
}

function addQuote() {
  const name = document.getElementById('q-in-name').value.trim();
  const area = document.getElementById('q-in-area').value.trim() || '—';
  const mat = document.getElementById('q-in-mat').value.trim() || 'خامة';
  const price = parseFloat(document.getElementById('q-in-price').value);
  const moq = parseInt(document.getElementById('q-in-moq').value, 10) || 1;
  const ship = parseFloat(document.getElementById('q-in-ship').value) || 0;
  const waste = parseFloat(document.getElementById('q-in-waste').value) || 0;
  if (!name || isNaN(price) || price <= 0) return;
  state.ws.quotes.push({ name, area, mat, price, moq, ship, waste });
  saveLocal();
  renderWorkspacePage();
}

function delQuote(idx) {
  state.ws.quotes.splice(idx, 1);
  saveLocal();
  renderWorkspacePage();
}

function toggleTask(idx) {
  const k = 't_' + idx;
  state.ws.tasks[k] = !state.ws.tasks[k];
  saveLocal();
  renderWorkspacePage();
}

function copyWsLink(url, btn) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(() => {
      const old = btn.textContent;
      btn.textContent = 'تم النسخ ✓';
      setTimeout(() => { btn.textContent = old; }, 1400);
    });
  }
}

function emailWsLink(url) {
  const em = state.user.email || prompt('أدخل بريدك الإلكتروني:');
  if (!em) return;
  state.user.email = em.trim();
  saveLocal();
  window.location.href = `mailto:${encodeURIComponent(state.user.email)}?subject=${encodeURIComponent('مساحة مشروعي')}&body=${encodeURIComponent(url)}`;
}

function sharePartnerLink() {
  const baseUrl = window.location.origin + window.location.pathname;
  const pUrl = `${baseUrl}?partner_check=1&hq1=${encodeURIComponent(state.ans.q1 || '')}&hq8=${encodeURIComponent(state.ans.q8 || '')}`;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(pUrl).then(() => alert('تم نسخ رابط اختبار الشريك.'));
  }
}

function checkPartnerUrl() {
  const p = new URLSearchParams(window.location.search);
  if (p.get('partner_check') === '1') {
    partnerParams = { hq1: p.get('hq1') || '', hq8: p.get('hq8') || '' };
    const b = document.getElementById('partner-banner');
    b.classList.remove('hidden');
    b.innerHTML = `<strong>اختبار توافق الشريك:</strong> أجب عن الأسئلة لحساب درجة التكامل.`;
  }
}

function showPartnerReport() {
  let score = 55;
  if (state.ans.q1 !== partnerParams.hq1) score += 25;
  if (state.ans.q8 !== partnerParams.hq8) score += 15;
  const b = document.getElementById('partner-banner');
  b.innerHTML = `<h3>نسبة التكامل مع شريكك: ${score}%</h3><button type="button" class="btn sm" style="margin-top:8px;" onclick="window.location.href=window.location.pathname">ابدأ تجربتك المستقلة</button>`;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function saveLocal() {
  try { localStorage.setItem('ebda2_clean_v12', JSON.stringify(state)); } catch (e) {}
}

function loadLocal() {
  try {
    const raw = localStorage.getItem('ebda2_clean_v12');
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d.ans) state.ans = d.ans;
    if (d.assets) state.assets = d.assets;
    if (d.assetMeta) state.assetMeta = { ...state.assetMeta, ...d.assetMeta };
    if (d.user) state.user = { ...state.user, ...d.user };
    if (d.rec) state.rec = d.rec;
    if (d.ws) state.ws = { ...state.ws, ...d.ws };

    if (state.user.name && state.user.name !== 'صديقنا') document.getElementById('in-name').value = state.user.name;
    if (state.user.age) document.getElementById('in-age').value = state.user.age;
    if (state.user.edu) document.getElementById('in-edu').value = state.user.edu;
    if (state.user.field) document.getElementById('in-field').value = state.user.field;
    if (state.user.gender) document.getElementById('in-gender').value = state.user.gender;
    if (state.user.resGov) document.getElementById('in-res-gov').value = state.user.resGov;
    if (state.user.envType) document.getElementById('in-env-type').value = state.user.envType;
    if (state.user.localRaw) document.getElementById('in-local-raw').value = state.user.localRaw;
    if (state.user.firstAdopter) document.getElementById('in-first-adopter').value = state.user.firstAdopter;
    if (state.user.capEGP) document.getElementById('in-capital').value = state.user.capEGP;

    document.querySelectorAll('#asset-cards-box .opt').forEach(b => {
      b.setAttribute('aria-pressed', state.assets.includes(b.getAttribute('data-asset')) ? 'true' : 'false');
    });
    const panel = document.getElementById('asset-details-panel');
    if (panel) panel.style.display = state.assets.includes('none') ? 'none' : 'block';

    if (state.user.token) document.getElementById('nav-ws-btn').classList.remove('hidden');

    const params = new URLSearchParams(window.location.search);
    if (params.get('ws_token') && Object.keys(state.ans).length === 12) {
      goPage(7);
    }
  } catch (e) {}
}

function exportDataJSON() {
  const s = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(state, null, 2));
  const a = document.createElement('a');
  a.href = s;
  a.download = 'mashro3i.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function clearAllData() {
  if (confirm('حذف كافة البيانات؟')) {
    try { localStorage.removeItem('ebda2_clean_v12'); } catch (e) {}
    window.location.href = window.location.pathname;
  }
}

loadLocal();
if (curPage >= 1 && curPage <= 4) renderQuizPage();
checkPartnerUrl();
syncLiveFX();
</script>
</body>
</html>
