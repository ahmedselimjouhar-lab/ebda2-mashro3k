<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اعرف أكتر عن نفسك | ابدأ مشروعك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
:root{--ink:#111111;--paper:#FFFFFF;--soft:#F5F5F5;--elem:#FAFAFA;--line:#DFDFE2;--mute:#6E6E73;--r-lg:14px;--r-md:10px;--r-sm:6px}
*{box-sizing:border-box;margin:0;padding:0;font-family:'IBM Plex Sans Arabic','Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{background:var(--paper);color:var(--ink);font-size:.96rem;line-height:1.75;padding:0 16px 64px}
.en-term{font-family:'Inter',sans-serif;direction:ltr;unicode-bidi:isolate;display:inline-block;background:var(--soft);border:1px solid var(--line);padding:1px 8px;border-radius:var(--r-sm);font-size:.82rem;font-weight:500;user-select:text!important}
.copy-btn{font-size:.74rem;background:var(--paper);color:var(--mute);border:1px solid var(--line);border-radius:var(--r-sm);padding:1px 7px;margin-inline-start:4px;cursor:pointer}
.copy-btn:hover{border-color:var(--ink);color:var(--ink)}

.bar{position:sticky;top:0;z-index:1000;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);margin:0 -16px 24px;padding:12px 16px}
.wrap{max-width:740px;margin:0 auto}
.bar .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-weight:700;font-size:1.05rem;color:var(--ink);text-decoration:none;cursor:pointer}
.nav-group{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ticker{font-size:.76rem;color:var(--mute);background:var(--elem);border:1px solid var(--line);padding:4px 10px;border-radius:99px}
.ticker strong{color:var(--ink);font-family:'Inter',sans-serif}
.select-sm{width:auto;padding:5px 9px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:.78rem;cursor:pointer}

.lang-switch{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--elem)}
.lang-btn{border:none;background:transparent;color:var(--ink);padding:5px 10px;font-size:.78rem;font-weight:600;cursor:pointer}
.lang-btn.active{background:var(--ink);color:var(--paper)}

.btn{font:inherit;font-size:.9rem;font-weight:600;background:var(--ink);color:var(--paper);border:1px solid var(--ink);border-radius:var(--r-md);padding:11px 20px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:opacity .15s}
.btn:hover{opacity:.88}
.btn.ghost{background:var(--paper);color:var(--ink);border-color:var(--line);font-weight:500}
.btn.ghost:hover{border-color:var(--ink);background:var(--soft)}
.btn.sm{padding:5px 11px;font-size:.78rem}

.hero{text-align:center;margin-bottom:20px}
h1{font-size:clamp(1.35rem,4vw,1.8rem);line-height:1.4;font-weight:700}
h2{font-size:1.15rem;line-height:1.5;margin-bottom:10px}
h3{font-size:.98rem;line-height:1.5;margin-bottom:8px}
.muted{color:var(--mute);font-size:.85rem}

.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:clamp(18px,4vw,28px);margin-bottom:20px}
.prog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:.82rem;font-weight:600;color:var(--mute)}
.prog{height:4px;background:var(--soft);border-radius:4px;margin-bottom:20px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ink);transition:width .2s ease}

.q-block{margin-bottom:20px;padding:6px;border-radius:var(--r-md)}
.q-block.missing{background:var(--soft);border:1.5px dashed var(--ink);padding:12px}
.q-title{display:block;font-weight:600;font-size:.94rem;margin-bottom:8px}
.opts{display:grid;gap:8px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:8px}

.opt{text-align:start;font:inherit;font-size:.88rem;background:var(--elem);color:var(--ink);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;transition:all .14s ease;width:100%}
.opt:hover{border-color:var(--ink);background:var(--soft)}
.opt.selected,.opt[aria-pressed="true"]{background:var(--ink)!important;color:var(--paper)!important;border-color:var(--ink)!important;font-weight:600}
.opt-check{width:18px;height:18px;border:1.5px solid var(--mute);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:.72rem;flex-shrink:0;color:transparent}
.opt.selected .opt-check,.opt[aria-pressed="true"] .opt-check{background:var(--paper)!important;color:var(--ink)!important;border-color:var(--paper)!important;font-weight:700}

input[type="text"],input[type="number"],input[type="email"],select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--paper);color:var(--ink);font:inherit;font-size:.88rem}
input:focus,select:focus{outline:none;border-color:var(--ink);background:var(--elem)}

.box{background:var(--soft);border:1px solid var(--line);border-radius:var(--r-md);padding:15px 18px;margin-bottom:14px}
.box.strong{background:var(--paper);border:1.5px solid var(--ink)}
.tag{display:inline-block;font-size:.74rem;font-weight:600;padding:2px 10px;border-radius:99px;border:1px solid var(--line);background:var(--soft)}
.tag.solid{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md);margin:10px 0}
table.mono-tbl{width:100%;border-collapse:collapse;font-size:.83rem;text-align:start}
table.mono-tbl th,table.mono-tbl td{padding:10px 12px;border-bottom:1px solid var(--line)}
table.mono-tbl th{background:var(--soft);font-weight:600}

.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.task-item{display:flex;align-items:center;gap:10px;padding:11px 14px;border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:8px;cursor:pointer;background:var(--paper)}
.task-item.done{background:var(--ink);color:var(--paper)}
.hidden{display:none!important}
@media(max-width:640px){.grid-2{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="bar">
  <div class="wrap">
    <a class="brand" id="ui-brand" onclick="goPage(1)">اعرف أكتر عن نفسك</a>
    <div class="nav-group">
      <div class="lang-switch">
        <button type="button" class="lang-btn active" id="btn-lang-ar" onclick="setLang('ar')">مصري</button>
        <button type="button" class="lang-btn" id="btn-lang-en" onclick="setLang('en')">English</button>
      </div>
      <span class="ticker"><span id="ui-usd-lbl">الدولار:</span> <strong id="fx-usd">56.15 EGP</strong></span>
      <select id="curr-select" class="select-sm" onchange="changeCurrency()">
        <option value="EGP">EGP (ج.م)</option>
        <option value="USD">USD ($)</option>
        <option value="SAR">SAR (ر.س)</option>
        <option value="AED">AED (د.إ)</option>
      </select>
      <a class="btn ghost sm" id="ui-about-link" href="about.html">اعرف أكثر عن ريادة الأعمال</a>
      <button type="button" class="btn ghost sm hidden" id="nav-ws-btn" onclick="goPage(7)">مساحة مشروعي</button>
    </div>
  </div>
</div>

<main class="wrap">
  <header class="hero">
    <h1 id="ui-hook">اكتشف نفسك، واكتشف إمكانيات لم تكن تعرف أنها لديك.</h1>
  </header>

  <div id="partner-banner" class="box strong hidden"></div>

  <!-- صفحات الأسئلة (1 إلى 4) -->
  <section class="card" id="quiz-page-card">
    <div class="prog-head">
      <span id="page-title-lbl">المجموعة 1 من 5</span>
      <span id="page-step-lbl">1 / 5</span>
    </div>
    <div class="prog"><i id="page-prog-bar" style="width:20%"></i></div>
    <div id="questions-mount"></div>
    <div class="row-between">
      <button type="button" class="btn ghost" id="prev-page-btn" onclick="prevPage()">→ السابق</button>
      <button type="button" class="btn" id="next-page-btn" onclick="nextPage()">التالي ←</button>
    </div>
  </section>

  <!-- الصفحة 5: الخلفية والأصول ورأس المال -->
  <section class="card hidden" id="page-5-card">
    <div class="prog-head">
      <span id="ui-p5-title">المجموعة 5 من 5: بياناتك وأصولك</span>
      <span>5 / 5</span>
    </div>
    <div class="prog"><i style="width:100%"></i></div>

    <div class="grid-2" style="margin-bottom:12px;">
      <div><label class="q-title" id="lbl-name" for="in-name">الاسم</label><input type="text" id="in-name" placeholder="..."></div>
      <div><label class="q-title" id="lbl-age" for="in-age">العمر</label><select id="in-age"></select></div>
    </div>

    <div class="grid-3" style="margin-bottom:12px;">
      <div><label class="q-title" id="lbl-edu" for="in-edu">التعليم</label><select id="in-edu"></select></div>
      <div><label class="q-title" id="lbl-field" for="in-field">التخصص / الخبرة</label><select id="in-field"></select></div>
      <div><label class="q-title" id="lbl-gender" for="in-gender">الجنس (اختياري)</label><select id="in-gender"></select></div>
    </div>

    <div class="grid-2" style="margin-bottom:12px;">
      <div><label class="q-title" id="lbl-res-gov" for="in-res-gov">محافظة السكن</label><select id="in-res-gov"></select></div>
      <div><label class="q-title" id="lbl-env-type" for="in-env-type">طبيعة منطقتك</label><select id="in-env-type"></select></div>
    </div>

    <div class="grid-2" style="margin-bottom:16px;">
      <div><label class="q-title" id="lbl-local-raw" for="in-local-raw">أقرب مورد متاح بمحيطك</label><select id="in-local-raw"></select></div>
      <div><label class="q-title" id="lbl-first-adopter" for="in-first-adopter">أقرب عميل أول تبيعه</label><select id="in-first-adopter"></select></div>
    </div>

    <label class="q-title" id="lbl-assets-box">الأصل المتاح لديك الآن</label>
    <div class="grid-3" id="asset-cards-box" style="margin-bottom:14px;"></div>

    <div id="asset-details-panel" class="box" style="margin-bottom:16px;">
      <div class="grid-3" style="margin-bottom:10px;">
        <div><label class="q-title" id="lbl-asset-own" for="in-asset-own">الحيازة</label><select id="in-asset-own"></select></div>
        <div><label class="q-title" id="lbl-asset-gov" for="in-asset-gov">موقع الأصل</label><select id="in-asset-gov"></select></div>
        <div><label class="q-title" id="lbl-asset-area" for="in-asset-area">المساحة (م²)</label><input type="number" id="in-asset-area" value="16" min="2"></div>
      </div>
      <div class="grid-2">
        <div><label class="q-title" id="lbl-asset-util" for="in-asset-util">طبيعة المرافق</label><select id="in-asset-util"></select></div>
        <div>
          <label class="q-title" id="lbl-gps">تحديد موقع الأصل (اختياري)</label>
          <button type="button" class="btn ghost sm" id="btn-gps" onclick="locateByGPS()">GPS</button>
          <span id="gps-status" class="muted" style="font-size:.74rem;margin-inline-start:6px;"></span>
        </div>
      </div>
    </div>

    <div class="grid-2" style="margin-bottom:6px;">
      <div><label class="q-title" id="lbl-capital" for="in-capital">رأس المال المتاح للبدء</label><input type="number" id="in-capital" value="20000" min="500" step="500" oninput="updateCapPreview()"></div>
      <div><label class="q-title" id="lbl-cap-curr" for="in-cap-curr">العملة</label><select id="in-cap-curr" onchange="updateCapPreview()"><option value="EGP">EGP (ج.م)</option><option value="USD">USD ($)</option><option value="SAR">SAR (ر.س)</option><option value="AED">AED (د.إ)</option></select></div>
    </div>
    <p id="cap-preview-note" class="muted" style="font-size:.78rem;"></p>

    <div class="row-between">
      <button type="button" class="btn ghost" id="btn-p5-back" onclick="goPage(4)">→ السابق</button>
      <button type="button" class="btn" id="btn-p5-go" onclick="showResultCapsule()">اعرض خطة المشروع ←</button>
    </div>
  </section>

  <!-- الصفحة 6: كبسولة البداية -->
  <section class="card hidden" id="page-6-card"><div id="capsule-mount"></div></section>

  <!-- الصفحة 7: مساحة مشروعي -->
  <section class="card hidden" id="page-7-card"><div id="workspace-mount"></div></section>
</main>

<!-- ربط ملف الخوارزمية الخارجي لضمان عدم حدوث أخطاء -->
<script src="engine.js"></script>
</body>
</html>
