.wrap{max-width:720px;margin:0 auto}

.prog{height:4px;background:var(--soft);border-radius:4px;margin-bottom:18px}
.prog i{display:block;height:100%;background:var(--ink);border-radius:4px;transition:width .2s}
.opts{display:grid;gap:10px;margin:18px 0}
.opt{text-align:start;font:inherit;line-height:1.7;background:var(--paper);color:inherit;border:1px solid var(--line);border-radius:10px;padding:12px 16px;cursor:pointer}
.opt:hover{border-color:var(--ink)}
.opt[aria-pressed=true]{border:2px solid var(--ink);padding:11px 15px;background:var(--soft);font-weight:600}
.btn{font:inherit;font-weight:600;background:var(--ink);color:#fff;border:1px solid var(--ink);border-radius:10px;padding:11px 22px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px}
:focus-visible{outline:3px solid #2b6cff;outline-offset:2px}
.name{font-size:clamp(2.2rem,10vw,3.6rem);font-weight:700;line-height:1.3;margin:4px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
.chip{border:1px solid var(--line);border-radius:99px;padding:2px 14px;font-size:.92rem}
.list{padding-inline-start:22px;margin-bottom:14px}
.list li{margin-bottom:6px}
.note{background:var(--soft);border-radius:10px;padding:12px 16px;font-size:.9rem;color:var(--mute);margin-top:18px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:16px 0}
.cols>div{border:1px solid var(--line);border-radius:10px;padding:14px 18px}
.cols h3{font-size:1rem;margin-bottom:6px}
.search{width:100%;font:inherit;padding:11px 14px;border:1px solid var(--line);border-radius:10px;margin:8px 0 16px}
.g{border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin-bottom:12px}
.g header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.g b{font-size:1.02rem}
.en{direction:ltr;unicode-bidi:isolate;font-family:Inter,system-ui,sans-serif;font-size:.88rem;background:var(--soft);padding:2px 10px;border-radius:6px}
.copy{font:inherit;font-size:.82rem;margin-inline-start:6px;background:none;border:1px solid var(--line);border-radius:6px;padding:0 8px;cursor:pointer;color:inherit}
.g p{margin-bottom:6px;font-size:.94rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.lg{padding:1px 12px;font-size:.9rem;margin-inline-end:6px}

const CAPS={
cost:{n:['كبسولة: احسب ربحك صح','Capsule: count your profit properly'],k:['الربح الحقيقي = السعر − كل التكاليف المتغيرة. والحد الأدنى للطلب الصغير بيحمي سيولتك.','Real profit = price minus every variable cost, and a small minimum order protects your cash.'],s:[
{s:['بتبيع بـ400 والخامة والتصنيع والتغليف 280. هتقول إن ربحك 120؟','You sell at 400; materials, making and packing cost 280. Is your profit 120?'],o:[[['أيوه، 120 خلاص.','Yes, 120.'],0],[['لأ، لسه هخصم الإعلان والشحن والفاقد.','No, I still deduct ads, shipping and waste.'],1],[['أزوّد 20% وخلاص.','Add 20% and move on.'],0]],w:['اللي فاضل بعد كل التكاليف المتغيرة هو هامش المساهمة، ومنه بتغطي مصاريفك الثابتة.','What is left after all variable costs is the contribution margin; it covers your fixed costs.']},
{s:['مورد بيبيع 1000 قطعة بسعر أرخص، وتاني 50 قطعة بسعر أغلى شوية. لسه مجربتش السوق.','One supplier sells 1,000 pieces cheaper, another 50 a bit dearer. You have not tested the market.'],o:[[['الـ1000 عشان أوفر.','The 1,000 to save money.'],0],[['الـ50، وأجرّب الأول.','The 50, and test first.'],1],[['الاتنين.','Both.'],0]],w:['الكمية الصغيرة بتحمي سيولتك لحد ما تتأكد إن الناس بتشتري.','The small quantity protects your cash until you know people buy.']}]},
sell:{n:['كبسولة: أول محادثة بيع','Capsule: your first sales conversation'],k:['البيع هو بناء ثقة وتقليل مخاطرة على المشتري. قول السعر بهدوء واسمع.','Selling is building trust and lowering the buyer\'s risk. State the price calmly and listen.'],s:[
{s:['العميل قال: غالي.','The customer says: too expensive.'],o:[[['أنزّل السعر فورًا.','Drop the price at once.'],0],[['أسأله: غالي مقارنة بإيه؟ وأوضح اللي بيوفره.','Ask: expensive compared to what? Then show what it saves him.'],1],[['أقوله مش هتلاقي أحسن.','Tell him he will not find better.'],0]],w:['السؤال بيكشف المشكلة الحقيقية، والخصم الفوري بيقول للعميل إن السعر كان مبالغ فيه.','The question reveals the real concern; an instant discount tells him the price was inflated.']},
{s:['جه وقت تطلب الفلوس وإنت محرج.','It is time to ask for payment and you feel awkward.'],o:[[['أبرر كتير.','Justify at length.'],0],[['أقول السعر بهدوء وأسكت.','Say the price calmly and stay quiet.'],1],[['أقول: اللي تشوفه.','Say: whatever you think.'],0]],w:['السعر الواضح بيدي ثقة. التبرير الكتير بيخلي العميل يشك.','A clear price builds confidence; over-explaining makes buyers doubt.']}]},
test:{n:['كبسولة: اختبر قبل ما تكمّل','Capsule: test before you perfect'],k:['نسخة صغيرة قدام ناس حقيقيين أفيد من كمال محدش شافه.','A small version in front of real people beats a perfect one nobody saw.'],s:[
{s:['جهزت 5 ألوان و500 قطعة قبل أول بيعة.','You prepared 5 colours and 500 pieces before the first sale.'],o:[[['كده تمام.','That is fine.'],0],[['كان الأحسن 10 قطع من موديل واحد وأعرضها للبيع.','Better: 10 pieces of one model, offered for sale.'],1],[['أزوّد الألوان.','Add more colours.'],0]],w:['اختبار صغير بيجاوب: هل الناس هتدفع؟ قبل ما تجمّد فلوسك في مخزون.','A small test answers whether people will pay, before cash gets stuck in stock.']},
{s:['نسختك مش كاملة بس بتشتغل.','Your version is not perfect but it works.'],o:[[['أستنى لما تتكمل.','Wait until it is perfect.'],0],[['أعرضها على 5 ناس وأسمع.','Show it to 5 people and listen.'],1],[['أعدّل لوحدي شهر كمان.','Tweak alone for another month.'],0]],w:['رأي ناس حقيقيين بيوفر عليك شهور تعديل في الفراغ.','Real feedback saves months of tweaking in a vacuum.']}]}};

let S={i:0};try{Object.assign(S,JSON.parse(localStorage.getItem('ebda2_v7')||'{}'))}catch(e){}
if(!(S.i>=0&&S.i<=STEPS.length))S.i=0;
const save=()=>{try{localStorage.setItem('ebda2_v7',JSON.stringify(S))}catch(e){}};

function calc(){
 const a={craft:0,trade:0,ops:0,digital:0};
 Q.filter(q=>q.w).forEach(q=>{if(S[q.id])a[S[q.id]]+=q.w});
 const R=({ok:2,tight:1,no:-1}[S.r]||0)+({go:2,plan:1,stuck:-1}[S.u]||0)+({solo:2,lead:2,part:1,team:-1}[S.a]||0);
 let mode=R>=4?'ready':R>=2?'side':'other';if(S.r=='no'&&mode=='ready')mode='side';
 const ks=Object.keys(a).sort((x,y)=>a[y]-a[x]),cap=+S.cap||0,likes=S.likes||[],have=S.have||[];
 const r=P.filter(p=>p.min<=cap).map(p=>{const lk=p.like.filter(x=>likes.includes(x)),hv=p.need.filter(x=>have.includes(x));
  const as=p.need.length?4*hv.length/p.need.length-1.5:.5;
  return{p,lk,hv,s:a[p.a]+((MOT[S.m]||{})[p.a]||0)+1.5*lk.length+as}}).sort((x,y)=>y.s-x.s);
 return{a,ks,mode,r,mixed:a[ks[0]]-a[ks[1]]<2};
}
const lbl=(L,v)=>t(L.find(x=>x[0]==v)[1]);
const li=(ul,x)=>ul.append(h('li',0,x));
function btn(x,c,f){const b=h('button','btn '+(c||''),x);b.type='button';b.onclick=f;return b}

function render(){
 const app=$('#app');app.replaceChildren();
 if(S.i>=STEPS.length)return S.v=='cap'?capsule(app):result(app);
 const st=STEPS[S.i],card=h('section','card'),pr=h('div','prog'),bar=h('i');bar.style.width=(S.i/STEPS.length*100)+'%';pr.append(bar);
 const title=h('h2',0,t(st.t));title.tabIndex=-1;
 card.append(pr,h('p','muted',t(U.q)+' '+(S.i+1)+' '+t(U.of)+' '+STEPS.length),title);
 const box=h('div','opts'),row=h('div','row'),next=btn(t(U.nx),'',()=>{S.i++;save();render()});
 const cur=()=>S[st.id]||(st.m?[]:null);
 st.o.forEach(([v,L])=>{const b=h('button','opt',t(L));b.type='button';
  b.setAttribute('aria-pressed',st.m?cur().includes(v):cur()===v);
  b.onclick=()=>{if(!st.m){S[st.id]=v;S.i++;save();render();return}
   let c=cur().slice();c=c.includes(v)?c.filter(x=>x!==v):(v=='none'?['none']:c.filter(x=>x!=='none').concat(v));
   S[st.id]=c;save();box.querySelectorAll('.opt').forEach((o,k)=>o.setAttribute('aria-pressed',c.includes(st.o[k][0])));next.disabled=!c.length};
  box.append(b)});
 row.append(S.i?btn(t(U.bk),'ghost',()=>{S.i--;save();render()}):h('span'));
 if(st.m){next.disabled=!cur().length;row.append(next)}
 card.append(box,row);app.append(card);title.focus({preventScroll:true});
}

function result(app){
 const c=h('section','card'),{a,ks,mode,r,mixed}=calc();
 if(mode=='other'&&!S.force){
  c.append(h('p','muted',t(U.ot)),h('div','name',t(PATH[ks[0]])),h('p',0,t(U.otw)));
  const u=h('ul','list');li(u,t(U.mv)+' '+t(MV[S.m]));li(u,t(U.ob)+' '+t(OB[S.o]));if(S.a=='part')li(u,t(U.pt));c.append(u,h('h2',0,t(U.try)),btn(t(U.ty),'',()=>{S.force=1;save();render()}));
 }else{
  const top=r[0],p=top.p;
  c.append(h('p','muted',t(U.nm)),h('div','name',t(p.n[0])),h('p',0,t(p.t)));
  const alt=h('div','chips');alt.append(h('span','muted',t(U.alt)));p.n.slice(1).forEach(n=>alt.append(h('span','chip',t(n))));
  c.append(alt,h('p','muted',t(U.nmn)));
  if(mode!='ready')c.append(h('p','note',t(U.sd)));
  c.append(h('h2',0,t(U.why)));const u=h('ul','list');
  li(u,mixed?t(U.mix)+' '+t(AR[ks[0]])+t(U.and)+t(AR[ks[1]])+'.':t(U.top)+' '+t(AR[ks[0]])+'.');
  li(u,t(U.mv)+' '+t(MV[S.m])+'.');
  if(top.lk.length)li(u,t(U.lk)+' '+top.lk.map(x=>lbl(LIKES,x)).join('، ')+'.');
  if(top.hv.length)li(u,t(U.hv)+' '+top.hv.map(x=>lbl(HAVE,x)).join('، ')+'.');else if(p.need.length)li(u,t(U.nh));
  li(u,t(U.ob)+' '+t(OB[S.o])+'.');li(u,t(U.mn)+' '+p.min.toLocaleString(LG=='ar'?'ar-EG':'en-US')+' '+t(U.egp)+'.');c.append(u);
  c.append(h('h2',0,t(U.sp)));const sp=h('ul','list');SPLIT[p.a].forEach(([l,n])=>li(sp,t(l)+': '+n+'%'));c.append(sp);
  c.append(h('h2',0,t(U.wk)));const wk=h('ol','list');WEEK[p.a].forEach(x=>li(wk,t(x)));c.append(wk);
  const gap=p.need.includes('skill')&&!(S.have||[]).includes('skill');
  const ck=gap?{craft:'test',trade:'sell',ops:'cost',digital:'test'}[p.a]:{sell:'sell',perf:'test',money:'cost',focus:'test'}[S.o];
  c.append(h('p','note',t(gap?U.cw1:U.cw2)),btn(t(U.cb)+' '+t(CAPS[ck].n),'',()=>{S.v='cap';S.ck=ck;S.ci=0;S.cs=0;S.cp=null;save();render()}));
  if(r.length>1){c.append(h('h2',0,t(U.near)));const al=h('ul','list');r.slice(1,3).forEach(x=>li(al,t(x.p.t)));c.append(al)}
 }
 const row=h('div','row');
 row.append(btn(t(U.ed),'ghost',()=>{S.i=0;S.force=0;save();render()}),btn(t(U.rs),'',()=>{S={i:0};save();render()}));c.append(row);app.append(c);
}

function capsule(app){
 const C=CAPS[S.ck],c=h('section','card');c.append(h('h2',0,t(C.n)));
 if(S.ci>=C.s.length){
  c.append(h('p',0,t(U.sc)+': '+S.cs+' / '+C.s.length),h('p','note',t(C.k)),btn(t(U.bkr),'',()=>{S.v=0;save();render()}));
 }else{
  const sc=C.s[S.ci],done=S.cp!=null,box=h('div','opts');
  c.append(h('p','muted',(S.ci+1)+' / '+C.s.length),h('p',0,t(sc.s)));
  sc.o.forEach(([L,g],k)=>{const b=h('button','opt',t(L));b.type='button';b.setAttribute("aria-pressed",!!(done&&(g||S.cp==k)));
   b.onclick=()=>{if(done)return;S.cp=k;S.cs+=g;save();render()};box.append(b)});
  c.append(box);
  if(done){c.append(h('p','note',t(sc.o[S.cp][1]?U.ok:U.no)+' '+t(sc.w)),btn(t(U.nx),'',()=>{S.ci++;S.cp=null;save();render()}))}
 }
 app.append(c);
}

function applyLang(){
 const d=document.documentElement;d.lang=LG=='ar'?'ar-EG':'en';d.dir=LG=='ar'?'rtl':'ltr';
 document.title=t(U.br);['br','ab','h1','p1','nt'].forEach(k=>{$('#'+k).textContent=t(U[k])});
 $('#lgA').setAttribute('aria-pressed',LG=='ar');$('#lgE').setAttribute('aria-pressed',LG!='ar');render();
}
[['lgA','ar'],['lgE','en']].forEach(([id,l])=>$('#'+id).onclick=()=>{LG=l;try{localStorage.setItem('ebda2_lg',l)}catch(e){}applyLang()});
applyLang();
</script>
